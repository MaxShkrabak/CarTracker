<form (ngSubmit)="onForgotPassword()">
    <div class="auth-container">
        <h1>Forgot Password?</h1>
        <p>Enter your email and we'll send you a verification code.</p>

        <div class="form-group">
            <label>Username <input class="email-input" name="username" placeholder="example@gmail.com"/></label>
        </div>

        <button class="btn-primary" type="submit">Send Code</button>

        <!-- Route or new input box for code -->

    </div>
</form>
