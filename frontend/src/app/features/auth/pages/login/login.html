<form (ngSubmit)="onLogin()" #loginForm="ngForm">
  <div class="auth-container">
    <h1 class="header-title">Car Tracker</h1>
    <p class="sub-header">Sign In to Your Account</p>

    <!-- Login inputs -->
    <div class="form-container">
      <!-- Username -->
      <div class="form-group">
        <label
          >Username
          <input
            class="login-input"
            name="username"
            type="text"
            [(ngModel)]="username"
            placeholder="Enter your email"
        /></label>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label
          >Password
          <input
            class="login-input"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
        /></label>
        <a
          class="btn-secondary forgot-password"
          [routerLink]="['/forgot-password']"
          routerLinkActive="router-link-active"
          >Forgot password</a
        >
      </div>
    </div>

    <button class="btn-primary" type="submit">Sign In</button>

    <!-- New user sign up -->
    <div class="sign-up">
      <p>
        Don't have an account? <a routerLink="/register" class="btn-secondary">Create Account</a>
      </p>
    </div>
  </div>

  <app-obd/>
</form>
