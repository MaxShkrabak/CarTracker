<form (ngSubmit)="onLogin()" #loginForm="ngForm">
  <div class="auth-container">
    <h1 class="header-title">Welcome Back</h1>
    <p class="sub-header">Log in to continue to your dashboard.</p>

    <!-- Login inputs -->
    <div class="form-container">
      <!-- Username -->
      <div class="form-group">
        <label
          >Username
          <input
            class="login-input"
            name="username"
            type="text"
            [(ngModel)]="username"
            placeholder="Enter your email"
        /></label>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label
          >Password
          <div class="input-wrapper">
            <input
              class="login-input"
              name="password"
              [type]="hidePassword() ? 'password' : 'text'"
              [(ngModel)]="password"
              placeholder="Enter your password"
            />
            <button type="button" class="toggle-eye" (click)="togglePasswordVisibility()">
              <lucide-icon [img]="hidePassword() ? EyeOff : Eye"/>
            </button>
          </div>
        </label>
        <a
          class="btn-secondary forgot-password"
          [routerLink]="['/forgot-password']"
          routerLinkActive="router-link-active"
          >Forgot password?</a
        >
      </div>
      <button class="btn-primary" type="submit">Sign In</button>
    </div>

    <!-- New user sign up -->
    <div class="sign-up">
      <p>
        Don't have an account? <a routerLink="/register" class="btn-secondary">Sign up</a>
      </p>
    </div>
  </div>
</form>
