<form (ngSubmit)="onRegister(registerForm)" #registerForm="ngForm">
  <div class="auth-container">
    <div class="auth-card">
      <h1 class="header-title">Car Tracker</h1>
    <p class="sub-header">Create your account</p>

    <!-- Input fields-->
    <div
      class="form-container"
      [class.shake-invalid]="shakeInvalid"
      (animationend)="shakeInvalid = false"
    >
      <div class="form-group">
        <label
          >Full Name
          <input
            type="text"
            name="fullName"
            [(ngModel)]="fullName"
            placeholder="Enter your full name"
            required
          />
        </label>
      </div>

      <div class="form-group">
        <label
          >Username
          <input
            type="email"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter your email"
            required
            email
        /></label>
      </div>

      <div class="form-group">
        <label
          >Password
          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            required
        /></label>

        <!-- Password rules -->
        <div class="password-rules-card" [class.complete]="passwordComplete">
          <p>Password Requirements</p>
          <ul class="password-rules" [class.shake]="shakeRules" (animationend)="shakeRules = false">
            @for (rule of rules; track rule.label) {
              <li [class.met]="rule.met">
                <lucide-icon class="circle-check" [img]="rule.met ? CircleCheck : Circle"/>
                {{ rule.label }}
              </li>
            }
          </ul>

        </div>

        </div>
        
        <div class="form-group">
          <label>
          Confirm Password
          <input
          class="confirm-password"
          type="password"
          id="confirm-password"
          name="confirmpassword"
          onpaste="return false;"
          [(ngModel)]="confirmpassword"
          aria-label="Confirm Password"
          placeholder="Confirm your password"
          required
        />
        </label>
        </div>
        

      <button class="btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account...' : 'Register' }}
      </button>
    </div>

    <!-- Error message -->
    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <!-- Login route -->
    <div class="sign-in">
      <p>Already have an account? <a routerLink="/login" class="btn-secondary">Sign in</a></p>
    </div>
    </div>
  </div>
</form>
