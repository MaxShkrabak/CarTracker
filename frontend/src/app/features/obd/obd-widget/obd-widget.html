<div class="component-container">
  <div class="obd-header">
    <span class="status-circle" [class.active]="obd.connected()"></span>
    <h2>Connect to OBD2</h2>
  </div>
  <p class="description">Connect your OBD2 adapter to start streaming real-time data.</p>

  <button
    class="btn-primary"
    type="button"
    [disabled]="!obd.connected() && vehicleId() === null"
    (click)="toggle()"
  >
    {{ obd.connected() ? 'Disconnect OBD2' : 'Connect OBD2' }}
  </button>
</div>
