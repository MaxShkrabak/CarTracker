<div class="component-container wheel-card">
  <div class="card-heading">
    <h2>Wheel Speeds</h2>
  </div>

  <div class="car">
    <div class="tyre fl" [class]="state().fl" [style.transform]="'rotate(' + steerDeg() + 'deg)'"></div>
    <div class="tyre fr" [class]="state().fr" [style.transform]="'rotate(' + steerDeg() + 'deg)'"></div>
    <div class="tyre rl" [class]="state().rl"></div>
    <div class="tyre rr" [class]="state().rr"></div>

    <img src="car-top.png" alt="Top-down view of car" />

    <div class="pct left front" [class]="state().fl"><small>FL</small>{{ fmt(diff().fl) }}</div>
    <div class="pct right front" [class]="state().fr"><small>FR</small>{{ fmt(diff().fr) }}</div>
    <div class="pct left rear" [class]="state().rl"><small>RL</small>{{ fmt(diff().rl) }}</div>
    <div class="pct right rear" [class]="state().rr"><small>RR</small>{{ fmt(diff().rr) }}</div>
  </div>
</div>
