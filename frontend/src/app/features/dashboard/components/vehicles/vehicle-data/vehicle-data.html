<div class="component-container">
  <h2 class="charts-title">Live Vehicle Data
    @if (obd.status().startsWith('Connected to')) {
      <span>Live</span>
    } @else if (lastUsed()) {
      <span>Last used: {{ lastUsed() | date: 'MMM d, h:mm a' }}</span>
    } @else {
      <span>Connect OBD2 to use</span>
    }
  </h2>

  <div class="charts-grid">
    <div class="metric-card">
      <div class="metric-header"><span>Speed</span></div>
      <div highchartsChart [options]="speedOptions()" class="chart"></div>
    </div>

    <div class="metric-card">
      <div class="metric-header"><span>RPM</span></div>
      <div highchartsChart [options]="rpmOptions()" class="chart"></div>
    </div>

    <div class="metric-card">
      <div class="metric-header"><span>Coolant Temp</span></div>
      <div highchartsChart [options]="coolantOptions()" class="chart"></div>
    </div>

    <div class="metric-card">
      <div class="metric-header"><span>Fuel Level</span></div>
      <div highchartsChart [options]="fuelOptions()" class="chart"></div>
    </div>

    <div class="metric-card">
      <div class="metric-header"><span>Battery Voltage</span></div>
      <div highchartsChart [options]="batteryOptions()" class="chart"></div>
    </div>
  </div>
</div>
